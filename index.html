<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>
<body>  <div id="container">
    <div id="hero">
        <h1> Metric/Imperial Unit Conversion </h1>
        <input type="text" id ="number"></input>
        <button id="convert-btn">Convert</button>
      </div>
     
     <div class="pockets">
        <h3>Length (Meter/Feet)</h3>
        <p><span class="numberclass">0</span> meters = <span id="meterstofeet">0</span> feet || <span class="numberclass">0</span> feet = <span id="feettometers">0</span> meters</p>
     </div>
      <div class="pockets">
        <h3>Volume (Liters/Gallons)</h3>
        <p><span class="numberclass">0</span> liters =  <span id="literstogallons">0</span> gallons || <span class="numberclass">0</span> gallons = <span id="gallonstoliters">0</span> liters</p>
     </div>
      <div class="pockets">
        <h3>Mass (Kilograms/Pounds)</h3>
        <p><span class="numberclass">0</span> kilos = <span id="kilostopounds">0</span> pounds || <span class="numberclass">0</span> pounds = <span id="poundstokilos">0</span> kilos</p>
     </div>
  </div>
 



     </div>   
    <script src="index.js"> </script>                      
</body>
</html>
